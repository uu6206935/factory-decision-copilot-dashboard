services:
  - type: web
    name: fdc-nbcy8qhf24fs
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      # Set in the Render dashboard (Environment tab), never in this file:
      # the repo is public, so anything committed here is readable by anyone.
      - key: DEEPSEEK_API_KEY
        sync: false
      # Link-only gate: the site 404s unless the visitor arrives with
      # ?k=<this value> once (it then sticks as a cookie).
      - key: ACCESS_KEY
        value: "12345678"
      - key: AUTH_MODE
        value: off
      - key: DEEPSEEK_SEND_SAMPLE_VALUES
        value: "false"
      - key: DEEPSEEK_SEND_DOCUMENT_TEXT
        value: "false"
      # The dashboard AI assistants answer from the dashboard_data/*.csv
      # snapshots, so the structured evidence has to be sent to the model.
      - key: DEEPSEEK_SEND_STRUCTURED_EVIDENCE
        value: "true"

# Notes:
# - DEEPSEEK_API_KEY is deliberately NOT committed (sync: false). Set it in the
#   Render dashboard so it never lands in this public repo or its ZIP download.
#   An earlier, now-superseded key was committed here; because git history keeps
#   it forever, that old key has to be revoked at DeepSeek to actually retire it.
# - The free plan's disk is ephemeral: runtime/factory_copilot.db (cases, audit
#   log, schema memory) resets on every redeploy/restart. For persistence, upgrade
#   to a paid instance type and attach a Render Disk mounted at /app/runtime, or
#   point DATABASE_URL at an external Postgres instance.
# - The free plan has 512MB RAM. This image loads pandas/scikit-learn/opencv; if
#   the service fails to boot or crashes under load, upgrade the plan.
